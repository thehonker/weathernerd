name: Build ESP32-C6 SuperMini firmware

on:
  push:
    branches: [main]
    paths:
      - 'local-storage/firmware/esp32c6-supermini/**'
  pull_request:
    paths:
      - 'local-storage/firmware/esp32c6-supermini/**'
  workflow_dispatch:

jobs:
  build:
    name: Compile ESP32-C6 SuperMini firmware
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build env Docker image
        run: |
          docker build \
            -t ghcr.io/thehonker/weathnerd-esp32c6-supermini-env:latest \
            -t ghcr.io/thehonker/weathnerd-esp32c6-supermini-env:${{ github.sha }} \
            local-storage/firmware/esp32c6-supermini/build-env

      - name: Push env image to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker push ghcr.io/thehonker/weathnerd-esp32c6-supermini-env:latest
          docker push ghcr.io/thehonker/weathnerd-esp32c6-supermini-env:${{ github.sha }}

      - name: Compile firmware
        run: |
          docker run --rm \
            -v "$(pwd)/local-storage/firmware/esp32c6-supermini:/project" \
            -w /project \
            -u $(id -u) \
            -e HOME=/tmp \
            ghcr.io/thehonker/weathnerd-esp32c6-supermini-env:${{ github.sha }} \
            /usr/local/bin/compile.sh

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: esp32c6-supermini-firmware
          path: |
            local-storage/firmware/esp32c6-supermini/build/esp32c6_weathernerd.bin
            local-storage/firmware/esp32c6-supermini/build/esp32c6_weathernerd.elf
            local-storage/firmware/esp32c6-supermini/build/bootloader/bootloader.bin
            local-storage/firmware/esp32c6-supermini/build/partition_table/partition-table.bin
          retention-days: 90
          if-no-files-found: error

      - name: Create release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: esp32c6-supermini-${{ github.sha }}
          name: ESP32-C6 SuperMini firmware (${{ github.sha }})
          body: |
            Firmware build from commit ${{ github.sha }}

            ## Files
            - `esp32c6_weathernerd.bin` — main application binary
            - `bootloader.bin` — ESP32-C6 bootloader
            - `partition-table.bin` — partition table
            - `esp32c6_weathernerd.elf` — debug symbols

            ## Flash
            ```bash
            ./flash.sh --ci ${{ github.sha }}
            ```
          files: |
            local-storage/firmware/esp32c6-supermini/build/esp32c6_weathernerd.bin
            local-storage/firmware/esp32c6-supermini/build/esp32c6_weathernerd.elf
            local-storage/firmware/esp32c6-supermini/build/bootloader/bootloader.bin
            local-storage/firmware/esp32c6-supermini/build/partition_table/partition-table.bin
